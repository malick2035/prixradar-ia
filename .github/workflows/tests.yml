name: Tests et sécurité
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt -r app/requirements.txt pip-audit
      - name: Tests des calculs et des résultats
        run: pytest -q
      - name: Analyse des failles connues dans les dépendances
        run: pip-audit -r app/requirements.txt
